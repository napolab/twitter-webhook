name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint & typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout でソースを読むだけ
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # .wxt/ と styled-system/ は gitignore された生成物。
      # node_modules がキャッシュヒットしたときも確実に生やす。
      - name: Codegen (wxt prepare + panda codegen)
        run: pnpm run prepare

      - run: pnpm lint

      - run: pnpm typecheck
